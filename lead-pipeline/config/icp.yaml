# ICP definition — the single source of truth for "is this a lead or not".
#
# This file exists so the qualification argument happens HERE, once, in writing,
# instead of in a spreadsheet review after the leads are already delivered.
# Edit thresholds and keywords freely; no code changes required.

version: 1

# Score buckets. A lead lands in exactly one.
#   score >= qualified  -> "qualified"  (goes to outreach)
#   score >= review     -> "review"     (human looks at it)
#   otherwise           -> "rejected"   (never reaches the boss)
thresholds:
  qualified: 60
  review: 35

# ---------------------------------------------------------------------------
# HARD EXCLUDES
# Any match here rejects the lead outright, regardless of score, and records a
# human-readable reason. This is the direct answer to "a lot of these are major
# creators / personal brands".
# ---------------------------------------------------------------------------
hard_excludes:

  # Audience ceiling: above this the person is a media property, not a buyer.
  # They already have distribution, so they do not need what we sell.
  max_followers: 75000

  # Audience floor: below this there is usually no real business behind it.
  min_followers: 250

  # Creator / personal-brand detector. Matched case-insensitively against
  # headline + bio. These are people who SELL marketing, not people who BUY it.
  persona_keywords:
    - content creator
    - creator
    - influencer
    - keynote speaker
    - public speaker
    - motivational
    - personal brand
    - thought leader
    - i help founders
    - i help coaches
    - i help you
    - i help entrepreneurs
    - dm me
    - link in bio
    - book a call
    - free masterclass
    - free webinar
    - build your brand
    - grow your audience
    - grow your linkedin
    - ghostwriter
    - copywriter
    - social media manager
    - community manager
    - life coach
    - business coach
    - mindset coach
    - career coach
    - marketing consultant
    - growth consultant
    - brand strategist

  # Competitors and lookalikes: agencies that sell the same service we do.
  competitor_keywords:
    - marketing agency
    - growth agency
    - lead generation
    - lead gen
    - demand generation
    - seo agency
    - ppc agency
    - smma
    - performance marketing
    - digital marketing agency
    - creative agency

  # Not a buying entity.
  disqualifying_titles:
    - student
    - intern
    - freelancer
    - seeking opportunities
    - open to work
    - retired
    - job seeker

  # Reject if we cannot tie the person to a company web domain. Without a
  # domain we cannot enrich an email, so the lead is dead on arrival anyway.
  require_company_domain: true

  # Reject dormant accounts (days since last post/activity). null disables.
  max_days_since_activity: 120

# ---------------------------------------------------------------------------
# SCORING SIGNALS
# Applied only to leads that survive the hard excludes.
# ---------------------------------------------------------------------------
signals:

  # Company headcount — the sweet spot is a company big enough to have budget
  # and small enough that the decision maker answers their own email.
  company_size:
    weight: 30
    bands:
      - { min: 11,  max: 200,  points: 30 }
      - { min: 201, max: 500,  points: 20 }
      - { min: 5,   max: 10,   points: 12 }
      - { min: 501, max: 2000, points: 8  }
      - { min: 0,   max: 4,    points: 0  }

  # Seniority of the contact.
  seniority:
    weight: 25
    tiers:
      - points: 25
        keywords: [founder, co-founder, cofounder, ceo, owner, managing director, president]
      - points: 20
        keywords: [cmo, cro, coo, cto, chief, vp, vice president, head of]
      - points: 12
        keywords: [director, partner, principal]
      - points: 5
        keywords: [manager, lead]

  # Does the company actually sell something we can plug into?
  industry:
    weight: 20
    preferred:
      - saas
      - software
      - e-commerce
      - ecommerce
      - technology
      - information technology
      - fintech
      - health tech
      - manufacturing
      - professional services
      - logistics
      - real estate
    points_preferred: 20
    points_other: 5

  # Followers in a normal-human range is a positive signal: real person,
  # real job, not a media operation.
  followers:
    weight: 15
    bands:
      - { min: 1000, max: 15000, points: 15 }
      - { min: 500,  max: 999,   points: 10 }
      - { min: 15001, max: 40000, points: 6 }
      - { min: 40001, max: 75000, points: 0 }

  # Recency of activity — a live account replies, a dead one does not.
  activity:
    weight: 10
    bands:
      - { max_days: 14, points: 10 }
      - { max_days: 45, points: 7 }
      - { max_days: 90, points: 3 }
      - { max_days: 120, points: 0 }

# ---------------------------------------------------------------------------
# ENRICHMENT
# ---------------------------------------------------------------------------
enrichment:
  # Providers are tried in order; the first verified hit wins. Adding a
  # provider later is a one-line change here.
  waterfall:
    - contactout
    - pattern

  # Only spend paid credits on leads worth contacting. This is what stops a
  # scrape of 5000 rows from burning the whole ContactOut allowance.
  enrich_buckets:
    - qualified

  # Phone lookups cost more credits than emails; keep them opt-in.
  fetch_phone: false

  # Skip a lead if a provider already returned a verified email.
  stop_on_verified: true
