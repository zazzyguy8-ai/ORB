<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The mark, on a plum tile. A favicon is read at 16px, so the figure is
       scaled up inside the tile and the chart bars are kept chunky — at that
       size the silhouette and the two eyes are the only things that survive. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#191430"/>
      <stop offset="100%" stop-color="#0a0713"/>
    </linearGradient>
    <linearGradient id="cloak" x1="16" y1="6" x2="46" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b7a5fd"/>
      <stop offset="34%" stop-color="#7c4df0"/>
      <stop offset="100%" stop-color="#3b16c9"/>
    </linearGradient>
    <linearGradient id="bars" x1="34" y1="52" x2="50" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9d85f9"/>
      <stop offset="100%" stop-color="#f4f1ff"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#tile)"/>

  <g transform="translate(3.5 4) scale(0.9)">
    <path fill="url(#cloak)"
          d="M35.5 3.4c10.8.6 17.6 9 17.6 20.4 0 5.6-.7 10.7-2 15.1-1.3 4.4-3.5 8-6.5 10.6-1.9 1.7-3.9 2.2-5.6 1.3-1.3 2.7-3.4 4.6-6 5.4-1.9.6-3.3-.2-3.9-2-.3-.8-.4-1.7-.3-2.7-3 3.6-6.8 6-11 7-1.6.4-2.3-.4-1.7-2 .7-2 2-4 3.6-5.8-3.4 2.3-7.1 3.6-10.8 3.7-1.7 0-2.1-1-1-2.4 1.9-2.4 4.5-4.6 7.4-6.3-1.7.3-3.3.3-4.7 0-1.4-.4-1.5-1.5-.3-2.6 1.9-1.6 4.3-2.9 6.9-3.7-2.3-4.7-3.5-10.3-3.5-16.6C13.7 12 21.3 3.4 32 3.4h3.5z"/>
    <ellipse cx="34.5" cy="26" rx="13.2" ry="13.8" transform="rotate(-6 34.5 26)" fill="#07050d"/>
    <path fill="#fff" d="M26.6 21.4c3.2.5 5.9 2.2 7.3 4.5-1.9 1.9-4.9 2.2-7 .8-1.9-1.3-2.4-3.6-.3-5.3z"/>
    <path fill="#fff" d="M42.4 21.4c-3.2.5-5.9 2.2-7.3 4.5 1.9 1.9 4.9 2.2 7 .8 1.9-1.3 2.4-3.6.3-5.3z"/>
    <g fill="url(#bars)">
      <rect x="36.8" y="44.2" width="3.6" height="7.4" rx="1.3"/>
      <rect x="41.9" y="40.4" width="3.6" height="11.2" rx="1.3"/>
      <rect x="47" y="35.4" width="3.6" height="16.2" rx="1.3"/>
    </g>
  </g>
</svg>
